<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otto's climb: 11+ and ISEB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--night:#142A3E;--snow:#F5F8FA;--glacier:#CFE3EE;--rope:#E8551C;--flag:#F4B400;--vr:#E8551C;--nvr:#0E8A9A;--en:#A3305E;--ma:#23634A;--vocab:#9A6A00;--line:#C9D6DF;
--disp:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--snow);color:var(--night);font:400 20px/1.55 var(--body);padding-bottom:env(safe-area-inset-bottom)}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--disp);line-height:1.12;margin:0}
h1{font-size:clamp(40px,7vw,68px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,4vw,36px);font-weight:800;margin:48px 0 18px}
h3{font-size:24px;font-weight:600}
a{color:var(--night);text-decoration-thickness:2px;text-underline-offset:4px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--flag);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px 40px}
.lede{font-size:23px;max-width:40ch;margin:14px 0 0}

/* header and tabs */
header{position:sticky;top:0;z-index:20;background:var(--night);padding-top:env(safe-area-inset-top)}
#tabs{display:flex;gap:6px;overflow-x:auto;max-width:1040px;margin:0 auto;padding:10px 16px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:#DCE7EE;font:600 19px var(--disp);padding:10px 16px;border-radius:999px}
.tab[aria-current=true]{background:#fff;color:var(--night)}
.tab-vr[aria-current=true]{box-shadow:inset 0 -4px 0 var(--vr)}.tab-nvr[aria-current=true]{box-shadow:inset 0 -4px 0 var(--nvr)}.tab-en[aria-current=true]{box-shadow:inset 0 -4px 0 var(--en)}.tab-ma[aria-current=true]{box-shadow:inset 0 -4px 0 var(--ma)}.tab-vocab[aria-current=true]{box-shadow:inset 0 -4px 0 var(--flag)}

/* hero */
.hero{position:relative;background:#1B3A55;color:#fff;min-height:440px;overflow:hidden}
#mtn{position:absolute;inset:0;width:100%;height:100%}
.hero-text{position:relative;max-width:1040px;margin:0 auto;padding:40px 22px 0}
.hero-text .lede{color:#E6EEF3}
.camplabel{font:800 22px var(--disp);fill:#fff;stroke:#142A3E;stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
.camp{opacity:0;transform-box:fill-box;animation:plant .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes plant{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}

/* route */
.route{list-style:none;margin:0;padding:0;border-left:4px dashed var(--rope);margin-left:10px}
.route li{display:grid;grid-template-columns:170px 1fr;gap:18px;padding:14px 0 14px 22px;position:relative}
.route li::before{content:"";position:absolute;left:-13px;top:22px;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--rope)}
.route li.small{opacity:.85}.route li.small h3{font-size:21px}
.route li.done{opacity:.5}
.when b{display:block;font-family:var(--disp);font-size:22px}.when span{font-size:18px;color:#4C6476}
.what p{margin:4px 0 0}
.star{display:inline-block;font:600 15px var(--body);background:var(--flag);border-radius:999px;padding:2px 10px;vertical-align:middle}
.pretest{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:18px 0 0 34px;font-weight:700}
input,select,textarea{font:inherit;color:var(--night);border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}

/* progress */
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.pcard{border:0;border-radius:18px;padding:18px;text-align:left;color:#fff;display:flex;flex-direction:column}
.pcard b.none{font-size:30px;margin-top:12px}.pcard span{font:600 20px var(--disp)}.pcard b{font:800 42px var(--disp);margin-top:6px}.pcard small{font-size:17px;opacity:.9}
.p-vr{background:var(--vr)}.p-nvr{background:var(--nvr)}.p-en{background:var(--en)}.p-ma{background:var(--ma)}.p-vocab{background:var(--flag);color:var(--night)}

/* schools */
.schools{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.school{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;padding:0 0 6px}
.school img{display:block;width:100%;height:170px;object-fit:cover}
.school h3{padding:18px 20px 0}
.school ul{margin:10px 0 12px;padding:0 20px 0 42px}.school li{margin:6px 0}
.s-sevenoaks{border-color:var(--flag);border-width:3px}
.rules{background:var(--night);color:#fff;border-radius:22px;padding:6px 28px 22px;margin-top:40px}
.rules h2{margin-top:24px}.rules li{margin:10px 0}
details.tutor{margin-top:40px;border-top:2px solid var(--line);padding-top:16px}
details summary{cursor:pointer;font:600 22px var(--disp)}
.backup{display:grid;gap:10px;grid-template-columns:auto auto 1fr;align-items:start}
.backup textarea{grid-column:1/-1;font-size:15px}

/* subject band */
.band{color:#fff;padding:34px 0 30px}
.band-vr{background:var(--vr)}main:has(.band-vr){--accent:var(--vr)}main:has(.band-nvr){--accent:var(--nvr)}main:has(.band-en){--accent:var(--en)}main:has(.band-ma){--accent:var(--ma)}.band-nvr{background:var(--nvr)}.band-en{background:var(--en)}.band-ma{background:var(--ma)}.band-vocab{background:var(--flag);color:var(--night)}
.bandin{display:flex;align-items:center;gap:26px;padding-bottom:0}
.band .lede{color:inherit}
.art{width:200px;flex:none;background:#fff;border-radius:22px;padding:10px}
.testcard{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:12px}
.testcard p{margin:4px 0 0}
.testcard.summit{border:3px solid var(--night);box-shadow:0 6px 0 var(--night)}
.poem{line-height:1.8;font-size:22px}.byline{color:#4C6476;margin:4px 0 0}
.btn{border:0;background:var(--night);color:#fff;font:600 21px var(--disp);padding:14px 26px;border-radius:999px;flex:none}
.btn.ghost{background:#fff;color:var(--night);box-shadow:inset 0 0 0 3px var(--night)}
.btn:disabled{opacity:.5}
.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.where>div{background:#fff;border-radius:16px;padding:16px 18px;border-top:6px solid var(--night)}
.where p{margin:6px 0 0}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.method{background:#fff;border-radius:16px;padding:16px 20px;border-left:8px solid var(--accent,var(--night))}
.method h3{font-size:22px}.method p{margin:8px 0 0}
.links li{margin:8px 0}
.writes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.wcard{text-align:left;background:#fff;border:2px solid var(--line);border-left:8px solid var(--en);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.wcard b{font:600 21px var(--disp)}.wcard small{color:#4C6476}

/* overlay */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(20,42,62,.55);overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 12px 40px}
.sheet{position:relative;max-width:900px;margin:0 auto;background:var(--snow);border-radius:24px;padding:26px 26px 30px;min-height:60vh}
.x{position:absolute;right:14px;top:12px;border:0;background:#fff;width:48px;height:48px;border-radius:50%;font-size:30px;line-height:1;z-index:2}
.modes{display:grid;gap:14px;margin-top:22px}
.mode{text-align:left;background:#fff;border:3px solid var(--night);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.mode b{font:800 26px var(--disp)}
.qtop{display:flex;align-items:center;gap:14px;padding-right:56px}
.bar{flex:1;height:12px;background:var(--glacier);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rope);border-radius:99px;transition:width .4s}
.bar.big{height:18px;margin-top:14px}
.qn{font-weight:700;white-space:nowrap}
.clockbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700}
.qtype{display:inline-block;margin-top:18px;font:600 18px var(--disp);background:var(--night);color:#fff;border-radius:999px;padding:4px 14px}
.qtext{font-size:24px;margin:16px 0 20px}
.words{display:block;margin-top:12px;font:600 26px var(--disp);background:#fff;border-radius:12px;padding:12px 16px}
.opts{display:grid;gap:10px}
.opts.figs{grid-template-columns:repeat(5,1fr)}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px 16px;min-height:60px}
.figs .opt{flex-direction:column;padding:10px 6px}
.opt .let{flex:none;width:36px;height:36px;border-radius:50%;background:var(--glacier);display:grid;place-items:center;font:800 19px var(--disp)}
.opt.picked{border-color:var(--night);background:#EAF2F7}.opt.picked .let{background:var(--night);color:#fff}
.opt.right{border-color:var(--ma);background:#E5F3EC}.opt.right .let{background:var(--ma);color:#fff}
.opt.wrong{border-color:var(--rope);background:#FDECE4}
.opt:disabled{cursor:default;color:inherit}
.fig{width:100%;max-width:120px;height:auto;display:block}
.stem{margin-top:16px}
.figrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.figrow .fig{width:96px;background:#fff;border-radius:10px}
.stem>.fig{max-width:300px;background:#fff;border-radius:12px}
.qbox{width:96px;height:96px;display:grid;place-items:center;border:3px dashed var(--night);border-radius:10px;font:800 40px var(--disp)}
.arrow{font:600 18px var(--body);color:#4C6476}
.mirror{width:6px;height:96px;background:repeating-linear-gradient(var(--nvr) 0 8px,transparent 8px 14px)}
.codetile{display:flex;flex-direction:column;align-items:center;gap:4px}.codetile .fig{width:86px}.codetile b{font:800 24px var(--disp)}
.grid3{display:grid;grid-template-columns:repeat(3,96px);gap:8px}.grid3 .fig,.grid3 .qbox{width:96px;background:#fff;border-radius:10px}
.passage{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 20px;margin-top:16px}
.passage[open]{max-height:52vh;overflow:auto}
.passage p{max-width:65ch;line-height:1.7}.ptitle{margin:14px 0 0}
.written{display:flex;gap:10px;flex-wrap:wrap}.written input{font-size:26px;width:min(320px,100%)}
.hint{color:#4C6476;font-size:18px}
.fb{margin-top:18px;border-radius:14px;padding:14px 18px;animation:rise .3s ease-out}
.fb.ok{background:#E5F3EC;border-left:8px solid var(--ma)}.fb.no{background:#FDECE4;border-left:8px solid var(--rope)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.next{display:flex;justify-content:flex-end;margin-top:20px}
.result{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:10px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--rope) calc(var(--p)*1%),var(--glacier) 0);display:grid;place-items:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.ring b{width:112px;height:112px;border-radius:50%;background:var(--snow);display:grid;place-items:center;font:800 34px var(--disp)}
@keyframes pop{from{transform:scale(.4)}}
.result+h3,.sheet h3{margin-top:26px}.chips span{display:inline-block;background:#fff;border:2px solid var(--rope);border-radius:999px;padding:4px 14px;margin:0 8px 8px 0;font-weight:700}
.review{padding-left:30px}.review li{margin:0 0 18px;padding:12px 16px;background:#fff;border-radius:14px;border-left:8px solid var(--ma)}
.review li.no{border-left-color:var(--rope)}.review .rq .words{font-size:20px}.review p{margin:6px 0}.review .ex{color:#33495B}
.wprompt{font-size:30px;margin-top:12px}
.wtools{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:14px 0}
.wclock{font:800 34px var(--disp)}
#wtext{width:100%;min-height:46vh;line-height:1.7}
.check{margin-top:14px}

/* vocab */
.vscore{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.vscore div{background:#fff;border-radius:18px;padding:16px 18px;border:2px solid var(--line)}
.vscore div:first-child{background:var(--night);color:#fff;border-color:var(--night)}
.vscore b{display:block;font:800 52px var(--disp);line-height:1}.vscore span{font-size:18px}
.decks{display:flex;flex-wrap:wrap;gap:12px}
.vtools{display:flex;gap:12px;flex-wrap:wrap}.vtools input{flex:1;min-width:220px}
.alpha{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.alpha button{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:44px;height:44px;font:600 19px var(--disp)}
.alpha button.on{background:var(--night);color:#fff;border-color:var(--night)}
.vlist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:12px 16px;border-left:8px solid var(--line)}
.vlist li.st1{border-left-color:var(--flag)}.vlist li.st2{border-left-color:var(--ma)}
.vlist b{font:600 24px var(--disp)}.vlist i{color:#4C6476}.vlist p{margin:2px 0 0}.vlist p span{color:#4C6476}
.pill{flex:none;border:2px solid var(--night);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:17px}
.pill.done{background:var(--ma);color:#fff;border-color:var(--ma)}
.empty{font-size:22px}
.fhead{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding-right:56px;font-size:19px}
.rev{display:flex;align-items:center;gap:8px}.rev input{width:24px;height:24px}
.flash{display:block;width:100%;max-width:620px;margin:26px auto 0;height:340px;border:0;background:transparent;perspective:1200px;position:relative;padding:0}
.face{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;backface-visibility:hidden;transition:transform .55s cubic-bezier(.4,.2,.2,1);text-align:center}
.front{background:#fff;border:4px solid var(--night);box-shadow:0 10px 0 var(--night)}
.back{background:var(--flag);border:4px solid var(--night);box-shadow:0 10px 0 var(--night);transform:rotateY(180deg)}
.flash.flipped .front{transform:rotateY(-180deg)}.flash.flipped .back{transform:rotateY(0)}
.fw{font:800 clamp(40px,8vw,62px) var(--disp);letter-spacing:-.01em}
.def{font-size:26px;margin:0;max-width:24ch}.syn{margin:0;font-size:22px}
.front small{font-size:18px;color:#4C6476}
.stagedots{display:flex;justify-content:center;gap:10px;margin-top:22px}.stagedots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--night)}.stagedots i.on{background:var(--ma);border-color:var(--ma)}
.fbtns{display:flex;justify-content:center;gap:14px;margin-top:20px}
.fbtns .btn{min-width:160px}

/* delight */
.spark{position:fixed;width:12px;height:12px;border-radius:3px;z-index:99;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.conf{position:fixed;top:-20px;width:12px;height:18px;z-index:99;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{top:105vh;rotate:540deg}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--night);color:#fff;padding:14px 22px;border-radius:999px;z-index:100;font-weight:700;max-width:90vw;text-align:center}

@media (max-width:700px){
  .schools{grid-template-columns:1fr}
  body{font-size:19px}
  .route li{grid-template-columns:1fr;gap:4px}
  .bandin{flex-direction:column;align-items:flex-start}.art{width:150px}
  .opts.figs{grid-template-columns:repeat(3,1fr)}
  .testcard{flex-direction:column;align-items:flex-start}
  .vscore b{font-size:40px}
  .sheet{padding:22px 16px 26px}
  .hero{min-height:0;display:flex;flex-direction:column}#mtn{position:static;display:block;height:auto;margin-top:8px;order:2}.hero-text{padding-top:28px}.camplabel{font-size:46px;stroke-width:8px}
  .figrow .fig,.qbox{width:78px;height:auto}.qbox{height:78px}
  .grid3{grid-template-columns:repeat(3,80px)}.grid3 .fig,.grid3 .qbox{width:80px;height:80px}
  .flash{height:300px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.camp{opacity:1}}
</style>
</head>
<body>
<header><nav id="tabs" aria-label="Sections"></nav></header>
<main id="main"></main>
<div id="overlay" hidden></div>
<div id="toast" hidden role="status"></div>
<script>
const VOCAB_RAW = `abandon|v|leave behind for good|desert

/* ---------- NVR drawing helpers (all native SVG, no images) ---------- */
let _pid = 0;
const INK = '#142A3E';
function svgWrap(inner, w = 110, h = 110) {
  const id = 'st' + (++_pid);
  return `<svg viewBox="0 0 ${w} ${h}" class="fig" role="img" aria-label="figure"><defs><pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="${INK}" stroke-width="3"/></pattern></defs>${inner.replace(/__STRIPE__/g, `url(#${id})`)}</svg>`;
}
function fillOf(f) { return f === 'black' ? INK : f === 'stripe' ? '__STRIPE__' : '#fff'; }
function polyPts(cx, cy, r, n, rotDeg = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (rotDeg - 90 + i * 360 / n) * Math.PI / 180;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
function shape(kind, cx, cy, r, fill = 'white', rot = 0, dash = false) {
  const f = fillOf(fill);
  const st = `fill="${f}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"${dash ? ' stroke-dasharray="7 5"' : ''}`;
  if (kind === 'circle') return `<circle cx="${cx}" cy="${cy}" r="${r}" ${st}/>`;
  const n = { triangle: 3, square: 4, pentagon: 5, hexagon: 6, heptagon: 7 }[kind];
  const rr = kind === 'square' ? r * 1.15 : kind === 'triangle' ? r * 1.15 : r;
  const pts = polyPts(cx, kind === 'triangle' && rot % 360 === 0 ? cy + r * 0.18 : cy, rr, n, kind === 'square' ? 45 + rot : rot);
  return `<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" ${st}/>`;
}
function dots(cx, cy, n, rad = 15, col = INK) {
  if (n === 1) return `<circle cx="${cx}" cy="${cy}" r="5" fill="${col}"/>`;
  return polyPts(cx, cy, rad, n, 0).map(([x, y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${col}"/>`).join('');
}

}

function isoCubes(cubes) {
  const W = 22, H = 12.7, V = 25;
  const proj = (x, y, z) => [130 + (x - y) * W, 100 + (x + y) * H - z * V];
  const sorted = [...cubes].sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[2] - b[2]);
  let s = '';
  for (const [x, y, z] of sorted) {
    const p = (dx, dy, dz) => proj(x + dx, y + dy, z + dz).map(v => v.toFixed(1)).join(',');
    s += `<polygon points="${p(0,0,1)} ${p(1,0,1)} ${p(1,1,1)} ${p(0,1,1)}" fill="#fff" stroke="${INK}" stroke-width="2"/>`;
    s += `<polygon points="${p(0,1,1)} ${p(1,1,1)} ${p(1,1,0)} ${p(0,1,0)}" fill="#BFD6E4" stroke="${INK}" stroke-width="2"/>`;
    s += `<polygon points="${p(1,0,1)} ${p(1,1,1)} ${p(1,1,0)} ${p(1,0,0)}" fill="#7FA6BD" stroke="${INK}" stroke-width="2"/>`;
  }
  return svgWrap(s, 260, 175);
}
function netFig(cells) {
  const s = 20, maxX = Math.max(...cells.map(c => c[0])), maxY = Math.max(...cells.map(c => c[1]));
  const w = (maxX + 1) * s, h = (maxY + 1) * s, ox = (110 - w) / 2, oy = (110 - h) / 2;
  return svgWrap(cells.map(([x, y]) => `<rect x="${ox + x * s}" y="${oy + y * s}" width="${s}" height="${s}" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`).join(''));
}
function holeSheet(holes) {
  return svgWrap(`<rect x="10" y="10" width="90" height="90" fill="#fff" stroke="${INK}" stroke-width="3"/>` + holes.map(([x, y]) => `<circle cx="${10 + x * .9}" cy="${10 + y * .9}" r="6" fill="${INK}"/>`).join(''));
}
function codeTile(kind, fill, code) {
  return `<div class="codetile">${svgWrap(shape(kind, 55, 55, 34, fill))}<b>${code}</b></div>`;
}

/* ---- extra NVR drawing helpers ---- */
function dotArrow(corner, ang) {
  const c = [[26, 26], [84, 26], [84, 84], [26, 84]][corner];
  return svgWrap(`<rect x="10" y="10" width="90" height="90" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="${c[0]}" cy="${c[1]}" r="8" fill="${INK}"/><g transform="rotate(${ang} 55 55)"><line x1="55" y1="72" x2="55" y2="42" stroke="${INK}" stroke-width="4"/><path d="M45 46 L55 32 L65 46 Z" fill="${INK}"/></g>`);
}
function rotDots(kind, rot, fill, n) {
  return svgWrap(shape(kind, 55, 55, 42, fill, rot) + dots(55, 55, n, 13, fill === 'black' ? '#fff' : INK));
}
function inner(outer, innerK, innerFill, innerRot = 0) {
  return svgWrap(shape(outer, 55, 55, 44, 'white') + shape(innerK, 55, 56, 20, innerFill, innerRot));
}
const FACE = {
  black: `<rect width="100" height="100" fill="${INK}"/>`,
  stripe: `<rect width="100" height="100" fill="__STRIPE__"/>`,
  dot: `<circle cx="50" cy="50" r="16" fill="${INK}"/>`,
  ring: `<circle cx="50" cy="50" r="26" fill="none" stroke="${INK}" stroke-width="9"/>`,
  square: `<rect x="31" y="31" width="38" height="38" fill="${INK}"/>`,
  plus: `<rect x="43" y="16" width="14" height="68" fill="${INK}"/><rect x="16" y="43" width="68" height="14" fill="${INK}"/>`
};
function faceG(sym, m) {
  return `<g transform="matrix(${m.join(' ')})"><rect width="100" height="100" fill="#fff"/>${FACE[sym]}<rect width="100" height="100" fill="none" stroke="${INK}" stroke-width="3" vector-effect="non-scaling-stroke"/></g>`;
}
function cube3(top, left, right) {
  const M = (p0, p1, p3) => [(p1[0] - p0[0]) / 100, (p1[1] - p0[1]) / 100, (p3[0] - p0[0]) / 100, (p3[1] - p0[1]) / 100, p0[0], p0[1]];
  return svgWrap(faceG(top, M([20, 36], [55, 16], [55, 56])) + faceG(left, M([20, 36], [55, 56], [20, 82])) + faceG(right, M([55, 56], [90, 36], [55, 102])));
}
const NET = [['black', 1, 0], ['stripe', 0, 1], ['dot', 1, 1], ['ring', 2, 1], ['square', 3, 1], ['plus', 1, 2]];
function netSym() {
  const s = 25, ox = 5, oy = 17;
  return svgWrap(NET.map(([sym, x, y]) => faceG(sym, [s / 100, 0, 0, s / 100, ox + x * s, oy + y * s])).join(''));
}
function mark3(kind, fill, ring) { return svgWrap(shape(kind, 55, 55, 36, fill) + (ring ? `<circle cx="55" cy="${kind === 'triangle' ? 64 : 57}" r="9" fill="#fff" stroke="${INK}" stroke-width="3"/>` : '')); }
function codeTile3(kind, fill, ring, code) {
  return `<div class="codetile">${mark3(kind, fill, ring)}<b>${code}</b></div>`;
}

<p>Wilson, the youngest, had begun the climb with an exuberance that Hartley had regarded with silent misgiving. Now that exuberance had curdled into something quieter and more watchful. He no longer sang. He had stopped, too, counting the steps between rests, as though he had realised that the mountain did not care how many there were.</p>
<p>It was on the fourth morning that the weather turned. The sky, which had been a hard and polished blue, acquired a bruised and yellowish tinge along its western edge, and a wind sprang up that smelled, Wilson thought, of metal. Hartley studied the horizon for a long time without speaking. Then he unshouldered his pack, sat down upon it, and began, with infinite deliberation, to fill his pipe.</p>
<p>"We shall go no further today," he said.</p>
<p>Wilson opened his mouth to protest and found, to his own astonishment, that he was relieved.</p>`;

  <path id="trail" d="M40 372 C150 360 180 330 260 330 S380 300 420 290 S520 270 560 248 S650 228 690 200 S770 160 800 150 S845 118 858 108" fill="none" stroke="#E8551C" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g id="camps"></g>

function placeHero() {
  const trail = $('#trail'); if (!trail) return;
  const L = trail.getTotalLength(), ev = events().filter(e => !e.small);
  const short = { iseb: 'Pre-Test', lat: 'Latymer', sev: 'Sevenoaks', all: "Alleyn's" };
  const stops = ev.map((e, i) => ({ e, f: 0.26 + i * (0.72 / Math.max(1, ev.length - 1)) }));
  const camps = $('#camps');
  camps.innerHTML = stops.map(({ e, f }, i) => {
    const p = trail.getPointAtLength(L * f);
    const col = e.star ? '#F4B400' : '#fff', up = i % 2 ? -62 : -58;
    return `<g class="camp" style="animation-delay:${0.9 + i * 0.25}s" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"><line x1="0" y1="0" x2="0" y2="-46" stroke="#142A3E" stroke-width="3"/><path d="M0 -46 L30 -38 L0 -30 Z" fill="${col}" stroke="#142A3E" stroke-width="2.5"/><text x="0" y="${up}" text-anchor="middle" class="camplabel">${short[e.key] || e.title}</text></g>`;
  }).join('');
  /* climber: piecewise between today-start and each camp by date */
  const pts = [{ d: START, f: 0.03 }, ...stops.map(s => ({ d: s.e.date, f: s.f }))];
  const now = new Date(); let f = pts[pts.length - 1].f;
  for (let i = 0; i < pts.length - 1; i++) { if (now < pts[i + 1].d) { const k = Math.max(0, (now - pts[i].d) / (pts[i + 1].d - pts[i].d)); f = pts[i].f + k * (pts[i + 1].f - pts[i].f); break; } }
  const target = L * f;
  const climber = $('#climber');
  if (reduceMotion) { const p = trail.getPointAtLength(target); climber.setAttribute('transform', `translate(${p.x},${p.y})`); return; }
  trail.style.strokeDasharray = `${L}`;
  trail.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1400, easing: 'ease-out', fill: 'forwards' }).onfinish = () => { trail.style.strokeDasharray = '2 12'; };
  const t0 = performance.now(), dur = 1600;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    const p = trail.getPointAtLength(Math.max(1, target * e));
    climber.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ================= QUIZ RUNNER ================= */
let R = null, timerId = null;
function overlay(html) { const o = $('#overlay'); o.innerHTML = `<div class="sheet">${html}</div>`; o.hidden = false; document.body.classList.add('locked'); o.scrollTop = 0; }
function closeOverlay() { clearInterval(timerId); $('#overlay').hidden = true; document.body.classList.remove('locked'); R = null; render(); }
function startTest(id) {
  const t = TESTS[id];
  if (t.written) return begin(id, 'learn');
  overlay(`<button class="x" onclick="closeOverlay()" aria-label="Close">×</button><h2>${t.title}</h2><p class="lede">How do you want to do it?</p>
  <div class="modes"><button class="mode" onclick="begin('${id}','exam')"><b>Exam conditions</b><span>Timer running, no going back, answers at the end. Just like the ISEB.</span></button>
  <button class="mode" onclick="begin('${id}','learn')"><b>Learn as you go</b><span>No timer. See the answer and the method after every question.</span></button></div>`);
}
function begin(id, mode) {
  const t = TESTS[id];
  R = { id, mode, i: 0, answers: [], left: t.mins * 60, hideTimer: false, t };
  if (mode === 'exam') { clearInterval(timerId); timerId = setInterval(() => { R.left--; const el = $('#clock'); if (el) el.textContent = clock(R.left); if (R.left <= 0) finish(); }, 1000); }
  showQ();
}
const clock = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
function showQ() {
  const q = R.t.qs[R.i], n = R.t.qs.length;
  const letters = 'ABCDE';
  overlay(`<div class="qtop"><button class="x" onclick="if(confirm('Leave this test? Your answers so far will not be saved.'))closeOverlay()" aria-label="Close">×</button>
    <div class="bar"><i style="width:${100 * R.i / n}%"></i></div><span class="qn">${R.i + 1} of ${n}</span>
    ${R.mode === 'exam' ? `<button class="clockbtn" onclick="R.hideTimer=!R.hideTimer;this.querySelector('span').hidden=R.hideTimer">⏱ <span id="clock" ${R.hideTimer ? 'hidden' : ''}>${clock(R.left)}</span></button>` : ''}</div>
    <div class="qtype">${q.t}</div>
    ${q.passage ? `<details class="passage" ${R.i === 0 || !R.t.qs[R.i - 1] || R.t.qs[R.i - 1].passage !== q.passage ? 'open' : ''}><summary>${q.passage === 'windy' ? 'Read the poem' : 'Read the passage'}</summary>${(R.t.passages && R.t.passages[q.passage]) || R.t.passage}</details>` : ''}
    <div class="qtext">${q.q}</div>
    ${q.ans ? `<div class="written"><input id="wa" inputmode="text" autocomplete="off" placeholder="Your answer"><button class="btn" id="check">Check</button></div><p class="hint">Do your working on paper, then type the answer.</p>`
      : `<div class="opts ${q.o[0].startsWith('<svg') ? 'figs' : ''}">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="let">${letters[k]}</span><span class="otext">${o}</span></button>`).join('')}</div>`}
    <div id="fb"></div><div class="next"><button class="btn" id="next" hidden>${R.i === n - 1 ? 'Finish' : 'Next'}</button></div>`);
  if (q.ans) {
    const check = () => { const v = $('#wa').value.replace(/\s|,/g, '').toLowerCase(); if (!v) return; const ok = q.ans.includes(v); R.answers[R.i] = ok ? 'ok' : v; feedback(ok, q); $('#check').disabled = true; $('#wa').disabled = true; $('#next').hidden = false; };
    $('#check').onclick = check; $('#wa').onkeydown = e => { if (e.key === 'Enter') check(); }; $('#wa').focus();
  } else {
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (R.mode === 'learn' && R.answers[R.i] !== undefined) return;
      document.querySelectorAll('.opt').forEach(x => x.classList.remove('picked'));
      b.classList.add('picked'); R.answers[R.i] = +b.dataset.k; $('#next').hidden = false;
      if (R.mode === 'learn') {
        const ok = +b.dataset.k === q.a;
        document.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        feedback(ok, q, b);
      }
    });
  }
  $('#next').onclick = () => { if (R.i < n - 1) { R.i++; showQ(); } else finish(); };
}
function feedback(ok, q, el) {
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Correct.' : 'Not this time.'}</b> ${q.x}</div>`;
  if (ok) burst(el || $('#fb'));
}
function isRight(q, a) { return q.ans ? a === 'ok' : a === q.a; }
function finish() {
  clearInterval(timerId);
  const qs = R.t.qs, score = qs.filter((q, i) => isRight(q, R.answers[i])).length, pct = Math.round(100 * score / qs.length);
  const rec = S.tests[R.id] || { best: 0, attempts: 0 };
  rec.attempts++; rec.best = Math.max(rec.best, pct); rec.last = pct; S.tests[R.id] = rec; save();
  const missed = {}; qs.forEach((q, i) => { if (!isRight(q, R.answers[i])) missed[q.t] = (missed[q.t] || 0) + 1; });
  const letters = 'ABCDE';
  overlay(`<button class="x" onclick="closeOverlay()" aria-label="Close">×</button>
  <div class="result"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><h2>${score} out of ${qs.length}</h2><p class="lede">${pct >= 85 ? 'Summit form. Try it again in exam conditions.' : pct >= 60 ? 'Solid climbing. Look at the types below and go again.' : 'Every mistake here is one you will not make in the exam. Read the methods, then try again.'}</p></div></div>
  ${Object.keys(missed).length ? `<h3>Practise these next</h3><p class="chips">${Object.entries(missed).map(([t, n]) => `<span>${t}${n > 1 ? ' ×' + n : ''}</span>`).join('')}</p>` : ''}
  <h3>Every question</h3><ol class="review">${qs.map((q, i) => { const a = R.answers[i], ok = isRight(q, a); return `<li class="${ok ? 'ok' : 'no'}"><div class="rq">${q.q.replace(/<div class="stem">[\s\S]*<\/div>$/, '')}</div><p>${q.ans ? `Your answer: <b>${a === undefined ? 'none' : ok ? q.ans[0] : esc(a)}</b>. Correct: <b>${q.ans[0]}</b>.` : `Your answer: <b>${a === undefined ? 'none' : letters[a]}</b>. Correct: <b>${letters[q.a]}</b>.`}</p><p class="ex">${q.x}</p></li>`; }).join('')}</ol>
  <div class="next"><button class="btn" onclick="closeOverlay()">Back to ${SUBJECTS[current] ? SUBJECTS[current].short : 'subject'}</button></div>`);
  if (pct >= 85) confetti();
}

/* ================= WRITING ================= */
let wTimer = null;
function openWriting(id) {
  const w = WRITING.find(x => x.id === id), saved = S.writing[id] || '';
  let left = w.mins * 60, running = false;
  overlay(`<button class="x" onclick="clearInterval(wTimer);closeOverlay()" aria-label="Close">×</button><div class="qtype">${w.school}, ${w.mins} minutes</div><h2 class="wprompt">${w.prompt}</h2><p class="hint">${w.tip}</p>
  <div class="wtools"><button class="btn" id="wgo">Start timer</button><span class="wclock" id="wclock">${clock(left)}</span><span id="wc">0 words</span></div>
  <textarea id="wtext" placeholder="Plan first (a few lines), then write here.">${esc(saved)}</textarea>
  <details class="check"><summary>Before you stop: check list</summary><ul><li>Does it start with something that grabs the reader?</li><li>Have you used at least three senses?</li><li>Do your sentences start in different ways?</li><li>Have you used two words from the vocabulary list?</li><li>Capital letters, full stops, speech marks checked?</li></ul></details>`);
  const ta = $('#wtext'), wc = () => $('#wc').textContent = (ta.value.trim().match(/\S+/g) || []).length + ' words';
  wc(); ta.oninput = () => { S.writing[id] = ta.value; save(); wc(); };
  $('#wgo').onclick = () => {
    if (running) { clearInterval(wTimer); running = false; $('#wgo').textContent = 'Carry on'; return; }
    running = true; $('#wgo').textContent = 'Pause'; ta.focus();
    wTimer = setInterval(() => { left--; $('#wclock').textContent = clock(left); if (left <= 0) { clearInterval(wTimer); $('#wclock').textContent = 'Time!'; toast('Time is up. Spend one minute checking.'); } }, 1000);
  };
}

/* ================= VOCABULARY ================= */
let vFilter = 'all', vSearch = '', vLetter = '';
function stage(w) { return S.vocab[w] || 0; }
function vocabStats() { const m = VOCAB.filter(v => stage(v.w) >= 2).length, l = VOCAB.filter(v => stage(v.w) === 1).length; return { m, l, left: VOCAB.length - m }; }
function vocabPage() {
  const st = vocabStats();
  return `<section class="band band-vocab"><div class="wrap bandin">${ART.vocab}<div><h1>Vocabulary</h1><p class="lede">${VOCAB.length} words that turn up again and again in 11+ reading, synonyms and antonyms. Get a word right twice, on different days, and it is mastered.</p></div></div></section>
  <section class="wrap">
    <div class="vscore"><div><b>${st.left}</b><span>words left to master</span></div><div><b>${st.m}</b><span>mastered</span></div><div><b>${st.l}</b><span>halfway there</span></div></div>
    <div class="bar big"><i style="width:${100 * st.m / VOCAB.length}%"></i></div>
    <h2>Flashcards</h2>
    <div class="decks"><button class="btn" data-deck="new">20 new words</button><button class="btn ghost" data-deck="half">Halfway words (${st.l})</button><button class="btn ghost" data-deck="mix">Mixed 20</button></div>
    <h2>The list</h2>
    <div class="vtools"><input id="vs" type="search" placeholder="Search a word or meaning" value="${esc(vSearch)}">
      <select id="vf"><option value="all">All words</option><option value="todo">Still to learn</option><option value="half">Halfway there</option><option value="done">Mastered</option></select></div>
    <div class="alpha">${'ABCDEFGHIJKLMNOPQRSTUVWYZ'.split('').map(c => `<button data-l="${c}" class="${vLetter === c ? 'on' : ''}">${c}</button>`).join('')}<button data-l="" class="${vLetter ? '' : 'on'}">All</button></div>
    <div id="vlist"></div>
  </section>`;
}
function listHTML() {
  const q = vSearch.toLowerCase();
  const items = VOCAB.filter(v => (!vLetter || v.w[0].toUpperCase() === vLetter) && (!q || v.w.includes(q) || v.d.includes(q) || v.s.includes(q)) &&
    (vFilter === 'all' || (vFilter === 'todo' && stage(v.w) === 0) || (vFilter === 'half' && stage(v.w) === 1) || (vFilter === 'done' && stage(v.w) >= 2)));
  if (!items.length) return `<p class="empty">No words match. Clear the search or pick another letter.</p>`;
  return `<ul class="vlist">${items.map(v => { const s = stage(v.w); return `<li class="st${Math.min(s, 2)}"><div><b>${v.w}</b> <i>${v.p}</i><p>${v.d}. <span>Similar: ${v.s}</span></p></div>${s >= 2 ? '<span class="pill done">Mastered</span>' : `<button class="pill" data-know="${v.w}">I know it</button>`}</li>`; }).join('')}</ul>`;
}
function bindVocab() {
  $('#vf').value = vFilter;
  const draw = () => { $('#vlist').innerHTML = listHTML(); };
  draw();
  $('#vs').oninput = e => { vSearch = e.target.value; draw(); };
  $('#vf').onchange = e => { vFilter = e.target.value; draw(); };
  document.querySelector('.alpha').onclick = e => { const b = e.target.closest('button'); if (!b) return; vLetter = b.dataset.l; document.querySelectorAll('.alpha button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  $('#vlist').onclick = e => { const b = e.target.closest('[data-know]'); if (!b) return; S.vocab[b.dataset.know] = 2; save(); burst(b); setTimeout(() => render(), 350); };
  document.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => deck(b.dataset.deck));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let F = null;
function deck(kind) {
  let pool = VOCAB.filter(v => stage(v.w) < 2);
  if (kind === 'new') pool = pool.filter(v => stage(v.w) === 0).slice(0, 20);
  else if (kind === 'half') pool = pool.filter(v => stage(v.w) === 1);
  else pool = shuffle(pool).slice(0, 20);
  if (!pool.length) return toast(kind === 'half' ? 'No halfway words yet. Start with new words.' : 'Every word is mastered. Incredible.');
  F = { cards: shuffle([...pool]), i: 0, got: 0, flip: false, reverse: false };
  card();
}
function card() {
  const v = F.cards[F.i], st = vocabStats();
  overlay(`<button class="x" onclick="closeOverlay()" aria-label="Close">×</button>
  <div class="fhead"><span>Card ${F.i + 1} of ${F.cards.length}</span><span><b>${st.left}</b> left to master</span><label class="rev"><input type="checkbox" id="rev" ${F.reverse ? 'checked' : ''}> Show meaning first</label></div>
  <button class="flash ${F.flip ? 'flipped' : ''}" id="flash" aria-label="Flip card"><div class="face front">${F.reverse ? `<p class="def">${v.d}</p><small>What is the word?</small>` : `<span class="fw">${v.w}</span><small>${v.p}. Say what it means, then tap.</small>`}</div>
  <div class="face back"><span class="fw">${v.w}</span><p class="def">${v.d}</p><p class="syn">Similar: <b>${v.s}</b></p></div></button>
  <div class="stagedots" aria-label="progress on this word">${[0, 1].map(k => `<i class="${stage(v.w) > k ? 'on' : ''}"></i>`).join('')}</div>
  <div class="fbtns" ${F.flip ? '' : 'hidden'} id="fbtns"><button class="btn ghost" id="no">Not yet</button><button class="btn" id="yes">Got it</button></div>`);
  $('#flash').onclick = () => { F.flip = true; $('#flash').classList.add('flipped'); $('#fbtns').hidden = false; };
  $('#rev').onchange = e => { F.reverse = e.target.checked; F.flip = false; card(); };
  $('#yes') && ($('#yes').onclick = () => {
    const today = new Date().toDateString(); S.vday = S.vday || {};
    F.got++;
    if (stage(v.w) === 1 && S.vday[v.w] === today) { toast('Nice. Get it right again on another day to master it.'); }
    else { const s = stage(v.w) + 1; S.vocab[v.w] = s; S.vday[v.w] = today; if (s >= 2) { burst($('#yes')); toast(`Mastered: ${v.w}`); } }
    save(); nextCard(); });
  $('#no') && ($('#no').onclick = () => { S.vocab[v.w] = 0; save(); nextCard(); });
}
function nextCard() {
  F.flip = false;
  if (F.i < F.cards.length - 1) { F.i++; setTimeout(card, 180); return; }
  const st = vocabStats();
  overlay(`<button class="x" onclick="closeOverlay()" aria-label="Close">×</button><div class="result"><div class="ring" style="--p:${Math.round(100 * F.got / F.cards.length)}"><b>${F.got}/${F.cards.length}</b></div><div><h2>Deck done</h2><p class="lede">${st.left} words left to master. Words you got right today come back on another day to lock them in.</p></div></div><div class="next"><button class="btn" onclick="closeOverlay()">Back to the list</button></div>`);
  if (F.got === F.cards.length) confetti();
}

/* ================= DELIGHT ================= */
function burst(el) {
  if (reduceMotion || !el) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('span'); s.className = 'spark';
    s.style.left = r.left + r.width / 2 + 'px'; s.style.top = r.top + r.height / 2 + 'px';
    const a = Math.PI * 2 * i / 7; s.style.setProperty('--dx', Math.cos(a) * 70 + 'px'); s.style.setProperty('--dy', Math.sin(a) * 70 - 20 + 'px');
    s.style.background = ['#E8551C', '#F4B400', '#0E8A9A', '#A3305E', '#23634A'][i % 5];
    document.body.appendChild(s); setTimeout(() => s.remove(), 800);
  }
}
function confetti() {
  if (reduceMotion) return;
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span'); s.className = 'conf';
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .6 + 's';
    s.style.background = ['#E8551C', '#F4B400', '#0E8A9A', '#A3305E', '#23634A', '#fff'][i % 6];
    s.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 2600);
  }
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2600); }

nav(); render();

</script>
</body>
</html>
